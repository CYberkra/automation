const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101418);
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
cam.position.set(26, -26, 30);
const rd = new THREE.WebGLRenderer({antialias:true});
rd.setSize(innerWidth, innerHeight);
document.body.appendChild(rd.domElement);
const ctl = new THREE.OrbitControls(cam, rd.domElement);
ctl.target.set(6, 6, 12);
scene.add(new THREE.AmbientLight(0xffffff, .55));
const dl = new THREE.DirectionalLight(0xffffff, .9); dl.position.set(20,-15,40); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, .35); dl2.position.set(-15,20,5); scene.add(dl2);

const groups = {air:new THREE.Group(), pml:new THREE.Group(), ant:new THREE.Group(), rock:new THREE.Group(), iface:new THREE.Group()};
Object.values(groups).forEach(g=>scene.add(g));

// domain wireframe 12x12x33
const dom = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(12,12,33)),
  new THREE.LineBasicMaterial({color:0x5a6b7c}));
dom.position.set(6,6,16.5); scene.add(dom);

// air 12..33 translucent
const air = new THREE.Mesh(new THREE.BoxGeometry(12,12,21),
  new THREE.MeshPhongMaterial({color:0x8ecae6, transparent:true, opacity:0.06, depthWrite:false}));
air.position.set(6,6,22.5); groups.air.add(air);
// surface plane z=12
const surf = new THREE.Mesh(new THREE.PlaneGeometry(12,12),
  new THREE.MeshPhongMaterial({color:0xc9ada7, transparent:true, opacity:0.28, side:THREE.DoubleSide}));
surf.rotation.x = 0; surf.position.set(6,6,12); groups.air.add(surf);

// PML shell: 1 m thick wire boxes (20 cells * 0.05)
const pml = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(10,10,31)),
  new THREE.LineBasicMaterial({color:0xff9f1c}));
pml.position.set(6,6,16.5); groups.pml.add(pml);

// rock base box 0..z0mean (visual: 0..8.6 solid faint)
const rock = new THREE.Mesh(new THREE.BoxGeometry(12,12,8.6),
  new THREE.MeshPhongMaterial({color:0x6d6875, transparent:true, opacity:0.35}));
rock.position.set(6,6,4.3); groups.rock.add(rock);

// rough interface surface from real binned table (48x48, 0.25 m bins; z0tab[bi,bj], bi=x, bj=y)
const N=48, BIN=0.25;
const geo = new THREE.PlaneGeometry(12,12,N-1,N-1);
geo.rotateX(0);
const pos = geo.attributes.position;
const colors = new Float32Array(pos.count*3);
let zmin=99, zmax=-99;
Z0.flat().forEach(v=>{zmin=Math.min(zmin,v);zmax=Math.max(zmax,v);});
for(let i=0;i<pos.count;i++){
  const bx = pos.getX(i)+6, by = pos.getY(i)+6;
  const bi = Math.min(N-1, Math.max(0, Math.round(bx/BIN-0.5)));
  const bj = Math.min(N-1, Math.max(0, Math.round(by/BIN-0.5)));
  const z = Z0[bi][bj];
  pos.setZ(i, 0); // plane in xy; we will displace via z coordinate
  pos.setXYZ(i, bx, by, z);
  const t = (z-zmin)/(zmax-zmin);
  const c = new THREE.Color().setHSL(0.62-0.5*t, 0.75, 0.45+0.2*t);
  colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
}
const flatZ = new Float32Array(pos.count);
for(let i=0;i<pos.count;i++) flatZ[i]=pos.getZ(i);
window.exag = function(k){
  for(let i=0;i<pos.count;i++) pos.setZ(i, 9.0+(flatZ[i]-9.0)*k);
  pos.needsUpdate=true; geo.computeVertexNormals();
};
geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
geo.computeVertexNormals();
const iface = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({vertexColors:true, side:THREE.DoubleSide, shininess:12}));
groups.iface.add(iface);

// antennas: col6 line x=1.625, Tx y=2.60+0.25k z=27, Rx=Tx+1.30 (show every trace)
for(let k=0;k<25;k++){
  const y = 2.60+0.25*k;
  const tx = new THREE.Mesh(new THREE.SphereGeometry(0.09), new THREE.MeshBasicMaterial({color:0xe63946}));
  tx.position.set(1.625, y, 27); groups.ant.add(tx);
  const rx = new THREE.Mesh(new THREE.SphereGeometry(0.09), new THREE.MeshBasicMaterial({color:0x457b9d}));
  rx.position.set(1.625, y+1.30, 27); groups.ant.add(rx);
}
// dashed vertical guide from line to surface
const g1 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(1.625,2.6,27), new THREE.Vector3(1.625,2.6,12)]);
groups.ant.add(new THREE.Line(g1, new THREE.LineDashedMaterial({color:0xe63946, dashSize:.3, gapSize:.2})));
groups.ant.children[groups.ant.children.length-1].computeLineDistances();

// axes
scene.add(new THREE.AxesHelper(5));

window.tog = function(k){ groups[k].visible = !groups[k].visible; };
addEventListener('resize', ()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rd.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop); ctl.update(); rd.render(scene,cam);})();
